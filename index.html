<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2f3d94">
<title>Gefacalm Coach</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{
  --hdr:#2f3d94;--hdr-tx:#fff;--bg:#efe7dc;--dot:rgba(47,61,148,.07);
  --in:#fff;--out:#d9fdd3;--doc:#e8f0fe;--doc-line:#4a7bd8;
  --tx:#111b21;--mut:#667781;--acc:#4d8a1e;--acc-d:#3b6c16;
  --card:#fff;--line:rgba(17,27,33,.12);
  --say:#eef6e3;--proof:#eef1fb;--avoid:#fdecec;--avoid-tx:#9b1c1c;
  --chip:#fff;--chip-tx:#2f3d94;--chip-line:rgba(47,61,148,.35);
  --sheet:#fff;--field:#fff;--bar:#f0f2f5;
  --t-deck:#0f7a3d;--t-deck-bg:#e3f6ea;--t-beyond:#9a5b00;--t-beyond-bg:#fff1d6;--t-coach:#5b3fb5;--t-coach-bg:#ece7fb;
  --shadow:0 1px .5px rgba(11,20,26,.14);
}
[data-theme=dark]{
  --hdr:#1c2240;--bg:#0b141a;--dot:rgba(255,255,255,.035);
  --in:#202c33;--out:#005c4b;--doc:#1b2a44;--doc-line:#6d9bf0;
  --tx:#e9edef;--mut:#8696a0;--card:#202c33;--line:rgba(255,255,255,.12);
  --say:#22301a;--proof:#1d2447;--avoid:#3b1f22;--avoid-tx:#ffb4b4;
  --chip:#1f2c34;--chip-tx:#aab6ff;--chip-line:rgba(170,182,255,.35);
  --sheet:#202c33;--field:#2a3942;--bar:#111b21;
  --t-deck:#6ee7a0;--t-deck-bg:#12382a;--t-beyond:#ffc861;--t-beyond-bg:#3d2f10;--t-coach:#c3b2ff;--t-coach-bg:#2b2450;
  --shadow:none;
}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--tx);background:#d9d4cc;overflow:hidden}
[data-theme=dark] body{background:#050a0d}
.app{position:relative;display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;background:var(--bg);overflow:hidden}
@media(min-width:700px){
  body{background:linear-gradient(#2f3d94 0 200px,#d9d4cc 200px)}
  [data-theme=dark] body{background:linear-gradient(#161b3a 0 200px,#050a0d 200px)}
  .app{height:min(calc(100dvh - 32px),880px);margin:16px auto;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.28)}
}

/* header */
.hdr{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--hdr);color:var(--hdr-tx);flex:none;z-index:3}
.avatar{position:relative;width:42px;height:42px;border-radius:50%;background:#fff;flex:none}
.avatar img{width:100%;height:100%;border-radius:50%;display:block}
.logo{display:block;width:100%;max-width:190px;height:auto;border-radius:8px;background:#fff}
.avatar .dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#25d366;border:2px solid var(--hdr)}
.who{flex:1;min-width:0}
.name{font-weight:700;font-size:16.5px;line-height:1.2}
.status{font-size:12.5px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border:0;background:transparent;color:inherit;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover,.ib:focus-visible{background:rgba(255,255,255,.14);outline:none}
.ring svg{display:block}

/* chat */
.chat{position:relative;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 10px 8px;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:22px 22px;scroll-behavior:auto}
.datechip{text-align:center;margin:2px 0 10px}
.datechip span{display:inline-block;background:var(--card);color:var(--mut);font-size:12px;padding:4px 10px;border-radius:8px;box-shadow:var(--shadow)}
.row{display:flex;margin:0 0 4px;animation:pop .22s ease-out both}
.row.me{justify-content:flex-end}
.row.bot{justify-content:flex-start}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.bubble{position:relative;max-width:88%;padding:7px 10px 6px;border-radius:12px;font-size:15px;line-height:1.42;box-shadow:var(--shadow);overflow-wrap:anywhere;word-break:break-word}
.row.bot .bubble{background:var(--in);border-top-left-radius:3px}
.row.me .bubble{background:var(--out);border-top-right-radius:3px}
.bubble.card{max-width:94%;width:94%}
.bubble.doctor{background:var(--doc);border-left:4px solid var(--doc-line);max-width:92%}
.bubble .meta{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--mut);margin-top:2px}
.spk{border:0;background:transparent;color:var(--mut);font-size:15px;line-height:1;cursor:pointer;padding:3px 7px;border-radius:12px;min-height:28px;margin-right:auto}
.spk:hover,.spk:focus-visible{background:var(--proof);outline:none}
.spk.on{background:var(--acc);color:#fff}
.tick{color:#53bdeb;font-size:13px;letter-spacing:-3px}
.ttl{font-weight:700;margin-bottom:3px}
.ln{margin:0}.gap{height:6px}
.bl{display:flex;gap:7px;margin:2px 0}.bl>span:first-child{flex:none;min-width:12px;color:var(--acc-d);font-weight:700}
[data-theme=dark] .bl>span:first-child{color:#b6e07f}
.sb{display:flex;gap:6px;margin:1px 0 1px 16px;font-size:14px}.sb>span:first-child{color:var(--mut)}
.src{display:inline-flex;gap:6px;align-items:flex-start;margin-top:7px;padding:4px 8px;border-radius:8px;font-size:12px;line-height:1.3}
.src b{white-space:nowrap}
.src.ref{background:var(--t-deck-bg);color:var(--t-deck)}
.say{background:var(--say);border-left:4px solid var(--acc);border-radius:8px;padding:8px 10px}
.sayh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--acc-d);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
[data-theme=dark] .sayh{color:#b6e07f}
.cp{border:1px solid var(--acc);background:transparent;color:var(--acc-d);font-size:12px;font-weight:700;border-radius:999px;padding:4px 11px;cursor:pointer;text-transform:none;letter-spacing:0;min-height:28px}
[data-theme=dark] .cp{color:#b6e07f}
.sayt{font-size:15px;font-style:italic}
.proof{background:var(--proof);border-radius:8px;padding:8px 10px}
.ph{font-size:12px;font-weight:700;color:var(--chip-tx);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.avoid{margin-top:7px;background:var(--avoid);color:var(--avoid-tx);border-radius:8px;padding:6px 9px;font-size:13.5px}
.docname{font-size:12px;font-weight:700;color:var(--doc-line);margin-bottom:2px}
.docq{font-size:16px;font-weight:600}

/* typing */
.typing .bubble{display:flex;gap:4px;padding:11px 13px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);opacity:.5;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-4px);opacity:1}}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 6px 2px;animation:pop .25s ease-out both}
.chip{border:1.5px solid var(--chip-line);background:var(--chip);color:var(--chip-tx);font:inherit;font-size:14px;font-weight:600;padding:8px 13px;border-radius:18px;cursor:pointer;min-height:38px;text-align:left;box-shadow:var(--shadow)}
.chip:hover,.chip:focus-visible{border-color:var(--acc);outline:none}
.chip.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.pri:hover{background:var(--acc-d)}

/* list / category cards */
.list{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;width:94%;max-width:94%}
.lh{padding:10px 12px;font-weight:700;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.li{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--chip-tx);font:inherit;font-size:14.5px;padding:11px 12px;cursor:pointer;min-height:44px}
.li:first-of-type{border-top:0}
.lh2{padding:7px 12px;font-size:12px;font-weight:700;color:var(--mut);background:var(--proof);text-transform:uppercase;letter-spacing:.3px;border-top:1px solid var(--line)}
.li:hover,.li:focus-visible{background:var(--proof);outline:none}
.li span{color:var(--mut);font-size:18px;flex:none}
.li .t{flex:1;color:inherit;font-size:inherit}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:94%}
.cat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;font:inherit;color:var(--tx);cursor:pointer;box-shadow:var(--shadow);min-height:84px}
.cat:hover,.cat:focus-visible{border-color:var(--acc);outline:none}
.cat b{display:block;font-size:14.5px;margin:2px 0}
.cat small{display:block;color:var(--mut);font-size:12px;line-height:1.3}
.cat .ci{font-size:22px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}
.tile{background:var(--proof);border-radius:10px;padding:8px 9px}
.tile b{display:block;font-size:17px;color:var(--acc-d);line-height:1.15}
[data-theme=dark] .tile b{color:#b6e07f}
.tile span{display:block;font-size:12px;color:var(--mut);line-height:1.25;margin-top:2px}
.score{display:grid;gap:3px}
.score div{display:flex;gap:7px}

/* bottom bars */
.suggest{flex:none;background:var(--bar);border-top:1px solid var(--line)}
.sg{display:flex;width:100%;gap:10px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--tx);font:inherit;font-size:14.5px;text-align:left;padding:10px 14px;cursor:pointer;min-height:44px}
.sg:last-child{border-bottom:0}
.sg i{font-style:normal;opacity:.7}
.sg:hover,.sg:focus-visible{background:var(--proof);outline:none}
.shortcuts{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px 10px 2px;background:var(--bar);scrollbar-width:none}
.shortcuts::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--chip-line);background:var(--chip);color:var(--chip-tx);font:inherit;font-size:13.5px;font-weight:600;border-radius:999px;padding:7px 13px;cursor:pointer;min-height:36px;white-space:nowrap}
.pill:hover,.pill:focus-visible{border-color:var(--acc);outline:none}
.composer{flex:none;display:flex;gap:8px;align-items:center;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--bar)}
.composer input{flex:1;min-width:0;border:0;background:var(--field);color:var(--tx);font:inherit;font-size:16px;padding:12px 16px;border-radius:24px;outline:none;box-shadow:var(--shadow)}
.composer input:focus-visible{box-shadow:0 0 0 2px var(--acc)}
.composer input::placeholder{color:var(--mut)}
.send,.mic{width:46px;height:46px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.send{background:var(--acc);color:#fff}.send:hover{background:var(--acc-d)}
.mic{background:var(--field);color:var(--mut);box-shadow:var(--shadow)}
.mic.on{background:#e5484d;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(229,72,77,.2)}}
.send:focus-visible,.mic:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);max-height:86dvh;overflow:auto;background:var(--sheet);border-radius:18px 18px 0 0;z-index:11;padding:6px 0 calc(14px + env(safe-area-inset-bottom));animation:up .25s ease-out both}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 8px}
.sh{padding:4px 18px 8px;font-weight:700;font-size:17px}
.mi{display:flex;width:100%;gap:14px;align-items:center;border:0;background:transparent;color:var(--tx);font:inherit;font-size:15.5px;text-align:left;padding:13px 18px;cursor:pointer;min-height:50px}
.mi:hover,.mi:focus-visible{background:var(--proof);outline:none}
.mi .e{font-size:20px;width:26px;text-align:center}
.mi small{display:block;color:var(--mut);font-size:12.5px}
.about{padding:0 18px 8px;font-size:14px;line-height:1.5}
.about h4{margin:12px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.about p{margin:4px 0}
.about .src{margin:3px 0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#111b21;color:#fff;font-size:14px;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ───────────── SCIENCE ───────────── */
{ id:'sci_cc', cat:'sci', q:'What is chronic cough?', s:'What is chronic cough?',
  keys:'chronic cough definition define duration 8 weeks eight week acute subacute classification meaning what is',
  a:`Chronic cough = a cough lasting **more than 8 weeks** in adults.
• Acute – short, usually infective, self-limiting
• Subacute – follows an infection, symptomatic care
• **Chronic – beyond 8 weeks**
It is more than a symptom: it can be anything from a protective reflex to the sign of a serious disease.`,
  say:`Doctor, once a cough crosses eight weeks it is no longer “just a cough” – it deserves a structured work-up.`,
  src:{t:'ref', r:'Morice et al., Eur Respir J 2020;55:1901136'}, next:['sci_chs','pt_diag','sci_epi'] },

{ id:'sci_reflex', cat:'sci', q:'How does the cough reflex work?', s:'How the cough reflex works',
  keys:'cough reflex mechanism pathway centre center medulla brainstem glottis nerve vagus how cough happens',
  a:`• Irritants activate **sensory nerve fibres** in the airway
• Signals travel to the **cough centre in the medulla oblongata** (brainstem)
• The brain triggers a sudden, forceful expulsion against a closed glottis – to clear secretions, foreign material and irritants
Traditional cough suppressants focus on the cough centre.`, next:['sci_p2x3','sci_chs'] },

{ id:'sci_chs', cat:'sci', q:'What is Cough Hypersensitivity Syndrome (CHS)?', s:'What is Cough Hypersensitivity Syndrome?',
  keys:'cough hypersensitivity syndrome chs hypersensitive nerves neuronal sensitised threshold neuropathic over sensitive',
  a:`RCC/UCC is increasingly seen as a **disease of cough hypersensitivity** – the airway nerves fire too easily.
• Airway inflammation → sensory neuron activation → **lowered cough-triggering threshold**
• So ordinary triggers (cold air, perfume, talking) provoke cough`,
  say:`Think of a smoke alarm set so sensitive it rings for toast. In these patients the cough nerves are that alarm.`,
  src:{t:'ref', r:'Chung et al., Nat Rev Dis Primers 2022;8:45'}, next:['sci_pheno','sci_rccucc','sci_moa'] },

{ id:'sci_pheno', cat:'sci', q:'What are the features and triggers of CHS?', s:'CHS features & triggers',
  keys:'chs features phenotype hypertussia allotussia laryngeal hypersensitivity urge to cough triggers cold air perfume talking singing odour smell',
  a:`**Phenotypes**
• **Hypertussia** – exaggerated cough to a normally tussive stimulus
• **Allotussia** – cough to a stimulus that normally wouldn’t cause cough
• **Laryngeal hypersensitivity** – throat irritation, tightness
• **Urge-to-cough** – persistent, distressing sensation before the cough
**Typical triggers:** talking/singing, cold air, perfume or strong odours.`,
  say:`Ask: “Does the cough start when your patient talks, steps into cold air, or smells perfume?” If yes – think CHS.`,
  src:{t:'ref', r:'Chung et al., Nat Rev Dis Primers 2022;8:45'}, next:['sci_chs','c_probe'] },

{ id:'sci_rccucc', cat:'sci', q:'RCC vs UCC – what is the difference?', s:'RCC vs UCC',
  keys:'rcc ucc refractory unexplained chronic cough difference definition idiopathic persistent despite treatment',
  a:`• **RCC (Refractory)** – cough persists despite investigation, identifying the underlying disease and guideline-based treatment (e.g. asthma treated, GERD controlled, post-nasal drip treated)
• **UCC (Unexplained)** – no clear cause found after an extensive, negative work-up
Both are increasingly seen as manifestations of **Cough Hypersensitivity Syndrome**.`,
  src:{t:'ref', r:'Smith et al., ERJ Open Res 2020;6(4):00284-2020'}, next:['sci_persist','pt_who'] },

{ id:'sci_persist', cat:'sci', q:'Why does cough persist after treating asthma, GERD or post-nasal drip?', s:'Why cough persists after treating the cause',
  keys:'why cough persists continue despite treatment asthma gerd reflux post nasal drip ppi not working still coughing refractory',
  a:`Those conditions explain **many – but not all** – cases. When cough continues, the driver is often **neuronal hypersensitivity**, not the original trigger.
• Routine, prolonged empirical PPI therapy is not always beneficial
• Symptoms often overlap with laryngeal hypersensitivity
• For RCC/UCC the approach is **neuromodulation / P2X3 blockade**`,
  src:{t:'ref', r:'Morice et al., Eur Respir J 2020;55:1901136; Irwin & Madison, N Engl J Med 2025;392:1203-1214'}, next:['pt_traits','sci_moa'] },

{ id:'sci_p2x3', cat:'sci', q:'What is the P2X3 receptor?', s:'What is the P2X3 receptor?',
  keys:'p2x3 receptor atp ion channel nerve fibre c fibre calcium sodium epithelium damaged purinergic signal',
  a:`P2X3 receptors sit on airway sensory nerve fibres and play a **central role in sending cough signals to the brain**.
1. Damaged epithelium releases **ATP**
2. ATP binds P2X3 → the ion channel opens (Na⁺, Ca²⁺ enter)
3. The nerve fibre fires → cough signal reaches the brain`,
  src:{t:'ref', r:'McGarvey et al., Lancet 2022;399(10328):909-923'}, next:['sci_moa','sci_diff'] },

{ id:'sci_moa', cat:'sci', q:'How does Gefapixant work? (Mechanism of action)', s:'How Gefapixant works (MoA)',
  keys:'gefapixant mechanism of action moa how does it work p2x3 antagonist first in class non narcotic selective blocks atp gefacalm what is',
  a:`Gefacalm (gefapixant 45 mg) is a **first-in-class, non-narcotic, selective P2X3 receptor antagonist**.
• ATP switches on P2X3 receptors on the airway’s sensory nerves and makes them over-sensitive
• Gefacalm **blocks those receptors** (and P2X2/3) → calms the cough reflex **at the nerve**
• → reduced neuronal hypersensitivity → **reduced cough frequency**
• **Not an opioid, codeine or steroid**`,
  say:`Gefapixant doesn’t just mute the cough – it quietens the over-excited nerve signal at its source.`,
  src:{t:'ref', r:'Markham, Drugs 2022;82(6):691-695'}, next:['sci_diff','ev_design','sci_narcotic'] },

{ id:'sci_diff', cat:'sci', q:'How is Gefapixant different from other cough preparations?', s:'Gefapixant vs other cough medicines',
  keys:'difference different compare other cough medicines antitussive dextromethorphan antihistamine cetirizine expectorant guaifenesin bronchodilator opioid codeine versus vs',
  a:`• **Antitussives** (dextromethorphan) – symptomatic suppression, short-term relief
• **Antihistamines** (cetirizine) – only allergic cough
• **Expectorants** (guaifenesin) – mucus clearance, not neural cough
• **Bronchodilators** – asthma-specific
• **Opioids** (codeine) – central suppression; sedation, dependence
• **Gefapixant – peripheral P2X3 blockade; a disease-specific approach**`,
  src:{t:'ref', r:'Markham, Drugs 2022;82(6):691-695; Parker et al., Thorax 2023;78(Suppl 6):s3-s19'}, next:['pt_existing','obj_antitussive'] },

{ id:'sci_narcotic', cat:'sci', q:'Is Gefapixant a narcotic or a sedative?', s:'Is it a narcotic / sedative?',
  keys:'narcotic opioid addiction dependence habit forming sedation sedative drowsy sleepy non narcotic controlled',
  a:`No – it is **not codeine, not an opioid, not a steroid and not a narcotic**. It is a P2X3 antagonist that acts on peripheral sensory nerves. Opioids such as codeine suppress cough centrally, with sedation and dependence concerns.
In the Phase 3 programme the **most common adverse events were taste-related**.`,
  src:{t:'ref', r:'Markham, Drugs 2022;82(6):691-695; McGarvey et al., Lancet 2022;399(10328):909-923'}, next:['saf_overview','sci_diff'] },

{ id:'sci_epi', cat:'sci', q:'How common is chronic cough – globally and in India?', s:'Prevalence – global & India',
  keys:'epidemiology prevalence how common global india indian urban rural percent burden numbers statistics',
  a:`**Global:** cough affects 4–10% of adults; about 12% of those with cough progress to chronic cough, and ~50% of chronic cough patients develop RCC/UCC. Chronic cough affects 6–10% of adults worldwide.
**India:** cough prevalence **1.7–5.4% (urban)** and **2.4–5.6% (rural)**.
True RCC prevalence in India is still incompletely characterised; patterns differ from Western cohorts because of environmental and infective exposures.`,
  src:{t:'ref', r:'Aggarwal et al., Indian J Chest Dis Allied Sci 2006;48:13-22; McGarvey et al., Lancet 2022;399(10328):909-923'}, next:['sci_india','sci_unmet'] },

{ id:'sci_india', cat:'sci', q:'What are the risk factors for chronic cough in India?', s:'Risk factors in India',
  keys:'risk factors india pollution pm2.5 biomass beedi tobacco smoking tb dust occupational recurrent infection indian patients',
  a:`• Ambient air pollution (high PM2.5 / PM10 in most cities)
• Biomass fuel exposure – household cooking smoke
• Beedi & tobacco use
• TB & post-TB lung disease
• Recurrent respiratory infections
• Occupational dust – construction, textile, mining`,
  src:{t:'ref', r:'Faruqi & Song, Lung India 2015;32(6):668-9; Sehgal et al., Curr Opin Pulm Med 2024;30(2):156-166'}, next:['sci_tb','pt_diag'] },

{ id:'sci_tb', cat:'sci', q:'Why does TB matter in chronic cough?', s:'TB & post-TB cough',
  keys:'tuberculosis tb post tb lung disease bronchiectasis fibrosis india 27 percent aafb sputum cough after tb cure',
  a:`• India carries ~**27% of the global TB burden** – TB stays a key differential
• Cough can persist **after microbiological cure** (post-TB bronchiectasis, fibrosis, airflow obstruction)
• Emerging concept: *M. tuberculosis*-associated neuroinflammation may add to cough hypersensitivity
• Always **exclude active TB** before labelling RCC/UCC`,
  src:{t:'ref', r:'Sehgal et al., Curr Opin Pulm Med 2024;30(2):156-166; India TB Report 2024 (NTEP)'}, next:['pt_redflags','obj_copd'] },

{ id:'sci_types', cat:'sci', q:'How does RCC/UCC differ from other types of cough?', s:'Cough types compared',
  keys:'types of cough acute subacute productive asthmatic gerd rcc ucc compare differ treatment approach table',
  a:`• Acute – infective origin → self-limiting
• Subacute – post-infection → symptomatic
• Productive – mucus → treat cause / mucolytics
• Asthmatic – airway inflammation → ICS / bronchodilator
• GERD cough – reflux → acid suppression
• **RCC/UCC – neuronal hypersensitivity → neuromodulation / P2X3 blockade**`,
  src:{t:'ref', r:'Parker et al., Thorax 2023;78(Suppl 6):s3-s19'}, next:['sci_rccucc','sci_moa'] },

{ id:'sci_unmet', cat:'sci', q:'What is the unmet need in chronic cough?', s:'The unmet need',
  keys:'unmet need burden problem gap symptomatic despite treatment 11 years duration side effects limited data',
  a:`• Chronic cough affects **6–10% of adults** worldwide
• Many stay symptomatic despite guideline-based treatment of asthma, GERD, UACS
• Pivotal-trial patients had coughed for about **11 years** on average
• Current options (gabapentin, dextromethorphan, low-dose morphine, codeine) carry considerable side effects and/or have limited data
• Traditional medicines relieve symptoms but don’t address cough hypersensitivity`,
  src:{t:'ref', r:'McGarvey et al., Lancet 2022;399(10328):909-923; Parker et al., Thorax 2023;78(Suppl 6):s3-s19'}, next:['pt_existing','sci_moa'] },

/* ───────────── PATIENTS & PRACTICE ───────────── */
{ id:'pt_diag', cat:'pt', q:'How do I diagnose chronic cough? (5-step framework)', s:'5-step diagnosis framework',
  keys:'diagnosis diagnose framework steps work up workup evaluation investigation chest x ray pfa pft feno eosinophils assessment algorithm erS guideline',
  a:`1. **Confirm** – duration >8 weeks; smoking, ACE-inhibitor, inhaled-irritant history
2. **Exclude red flags** – lung cancer, active TB, ILD, foreign body
3. **Evaluate treatable traits** – asthma/eosinophilic bronchitis, upper-airway disease, reflux
4. **Review exposures** – post-TB status, biomass/pollution, recurrent infections
5. **Identify CHS features** → label RCC / UCC
Routine tests: chest X-ray, PFT, FeNO, blood eosinophils.`,
  src:{t:'ref', r:'Morice et al., Eur Respir J 2020;55:1901136; Parker et al., Thorax 2023;78(Suppl 6):s3-s19'}, next:['pt_redflags','pt_traits'] },

{ id:'pt_redflags', cat:'pt', q:'Which causes must be excluded before calling it RCC/UCC?', s:'Red flags to exclude first',
  keys:'red flags exclude serious causes lung cancer tuberculosis interstitial lung disease foreign body aspiration ace inhibitor inhaled powder',
  a:`Exclude serious or reversible causes first:
• Lung cancer
• Active tuberculosis
• Interstitial lung disease
• Foreign-body aspiration; aspiration syndromes
• **ACE inhibitors**
• Certain inhaled powders causing laryngeal irritation`,
  src:{t:'ref', r:'Morice et al., Eur Respir J 2020;55:1901136; Parker et al., Thorax 2023;78(Suppl 6):s3-s19'}, next:['sci_tb','pt_traits'] },

{ id:'pt_traits', cat:'pt', q:'What is the treatable-traits approach?', s:'Treatable-traits approach',
  keys:'treatable traits airway upper airway reflux inhaled corticosteroid ics nasal steroid rhinitis sinusitis ppi lifestyle feno strategy management',
  a:`Treat what is treatable **first**:
• **Airway traits** – ICS for eosinophilic disease, optimise asthma, FeNO-guided care, treat bronchiectasis/chronic airway infection
• **Upper-airway traits** – intranasal steroids, saline irrigation, allergic rhinitis, chronic rhinosinusitis
• **Reflux traits** – lifestyle measures; PPI **only** with clinical evidence of reflux; consider non-acid reflux
If cough persists → RCC/UCC pathway.`,
  src:{t:'ref', r:'Morice et al., Eur Respir J 2020;55:1901136; Parker et al., Thorax 2023;78(Suppl 6):s3-s19; Gibson et al., Chest 2016;149:27-44'}, next:['obj_dx','pt_who'] },

{ id:'pt_existing', cat:'pt', q:'What treatments are used today, and what are their limits?', s:'Current options & their limits',
  keys:'existing treatments current options gabapentin pregabalin morphine low dose neuromodulators off label limitations side effects dizziness drowsiness constipation',
  a:`• **Gabapentin** – best-studied neuromodulator; dizziness, fatigue, cognitive slowing, poor long-term tolerability
• **Pregabalin** – drowsiness, dizziness, weight gain
• **Low-dose SR morphine** – constipation, somnolence, dependency concerns
**All of these are off-label for refractory chronic cough.**`,
  src:{t:'ref', r:'Gibson et al., Chest 2016;149:27-44; Morice et al., Eur Respir J 2020;55:1901136; Visca et al., Eur J Intern Med 2020;81:15-21'}, next:['obj_existing','sci_diff'] },

{ id:'pt_who', cat:'pt', q:'Which patients are right for Gefapixant?', s:'Which patients to target',
  keys:'which patients right candidate who to prescribe target patient profile indication eligible suitable rcc ucc recent onset',
  a:`Adults with **RCC or UCC** – cough persisting after proper work-up and treatable-trait management, or no cause found.
Trial profile: ≥18 yrs, chronic cough ≥1 year, cough severity VAS ≥40 mm, normal chest X-ray/CT.
**Recent-onset** chronic cough (≤12 months) is covered by the Phase IIIb study.
It is positioned for RCC/UCC – not for acute, productive, asthmatic or GERD cough.
**Adults aged 18 and over only.**`,
  say:`Think of the patient who has been through the full work-up, still coughs, and is triggered by cold air, perfume or talking.`,
  src:{t:'ref', r:'McGarvey et al., Lancet 2022;399(10328):909-923; Lung 2023;201(2):111-118'}, next:['pt_dose','ev_pop'] },

{ id:'pt_dose', cat:'pt', q:'What is the dose of Gefapixant?', s:'Dose',
  keys:'dose dosage 45 mg twice daily bid how to take administration posology tablet strength regimen',
  a:`**One 45 mg tablet twice daily (BID)**, with or without food, swallowed whole.
• Missed dose: **skip it, do not double**
**Dose changes**
• **None** in the elderly, in mild or moderate kidney disease, or in liver impairment
• **Severe kidney disease** (eGFR below 30, not on dialysis): **45 mg once daily**
45 mg BID is the dose studied in COUGH-1, COUGH-2 and the Phase IIIb trial.`,
  src:{t:'ref', r:'Lyfnua (gefapixant) EU Summary of Product Characteristics; McGarvey et al., Lancet 2022;399(10328):909-923'}, next:['saf_overview'] },

{ id:'pt_onset', cat:'pt', q:'How quickly does it work, and does the effect last?', s:'Speed of onset & durability',
  keys:'how quickly onset fast speed when work week 4 sustained durable lasting maintain response time to effect',
  a:`Improvements in cough frequency, severity and cough-specific quality of life were seen **from week 4** and were **sustained throughout the treatment period** in both COUGH-1 and COUGH-2.
Primary endpoints were assessed at **12 weeks** (COUGH-1) and **24 weeks** (COUGH-2).
Plan a **review visit**; if the patient reports no meaningful relief, reassess.`,
  src:{t:'ref', r:'McGarvey et al., Lancet 2022;399(10328):909-923'}, next:['ev_primary','ev_qol'] },

{ id:'pt_expect', cat:'pt', q:'How should I set expectations with doctors and patients?', s:'Setting honest expectations',
  keys:'expectations set expectation honest counsel promise cure realistic message tips positioning',
  a:`Be honest and specific:
• Quote results as **group averages**, not promises (62–63% reduction from baseline)
• Say plainly that **taste changes are common** – better raised up-front than discovered by the patient
• Position it for **RCC/UCC after work-up**, not as a general cough-syrup replacement
• Never say “cure” or “no side effects”`, next:['saf_counsel','c_close'] },

{ id:'pt_special', cat:'pt', q:'What about pregnancy, sulfa allergy, interactions or children?', s:'Pregnancy, sulfa allergy, interactions, children',
  keys:'pregnancy pregnant breastfeeding lactation sulfa allergy sulphonamide interaction interactions children paediatric adolescents under 18 renal kidney liver elderly special situations contraindication precaution safety in special groups',
  a:`• **Pregnancy:** no data – avoid in pregnancy and in women of childbearing age not using contraception
• **Breastfeeding:** the doctor decides whether to stop breastfeeding or not start the drug
• **Sulfa allergy:** contains a sulphonamide group, but not the type found in sulfa antibiotics; **not studied** in sulfa-allergic patients, so the label advises caution
• **Interactions:** clinical interaction studies found **no clinically meaningful interactions**
• **Children and teenagers:** adults aged **18 and over only**
• **Elderly / liver impairment / mild-moderate kidney disease:** no dose change; severe kidney disease (eGFR below 30, not on dialysis) – 45 mg once daily`,
  src:{t:'ref', r:'Lyfnua (gefapixant) EU Summary of Product Characteristics'}, next:['pt_dose','obj_pregnancy','obj_sulfa'] },

{ id:'pt_approval', cat:'pt', q:'Where is Gefacalm approved?', s:'Where is it approved?',
  keys:'approved approval where japan switzerland eu europe fda united states regulatory status first drug approved india cdsco launch countries',
  a:`Approved for refractory and unexplained chronic cough in:
• **Japan** (January 2022)
• **Switzerland** (2022)
• **EU** (September 2023) – the **first drug approved** for this condition
The US FDA has not approved it. Each regulator judges its own evidence package.
**India:** global trials covered 2,000+ patients across 17–20 countries; the CDSCO expert committee gave its nod for an Indian Phase III trial in July 2025.`,
  src:{t:'ref', r:'DrugBank (approvals); Lyfnua EU SmPC; Medical Dialogues, July 2025'}, next:['obj_fda','obj_india_data'] },

{ id:'pt_finder', cat:'pt', q:'How do I spot a refractory cough patient? (3 questions)', s:'3 questions to spot a refractory patient',
  keys:'spot identify refractory cough patient three questions screen finder quick check non smoker normal chest x ray ace inhibitor red flags refer start',
  a:`Ask three questions:
1. Has the cough lasted **more than 8 weeks**?
2. Is the patient a **non-smoker with a normal chest X-ray**?
3. Has it persisted **despite treating asthma, reflux and nasal allergy**, and stopping any **ACE inhibitor**?
**Yes to all three** → refractory or unexplained cough.
**Refer first** if red flags: blood in the sputum, weight loss, fever, an abnormal X-ray or a smoking history.`,
  say:`Has the cough lasted more than eight weeks? Is the patient a non-smoker with a normal chest X-ray? Has it persisted despite treating asthma, reflux and nasal allergy, and stopping any ACE inhibitor? If yes to all three, think refractory or unexplained cough.`,
  src:{t:'ref', r:'Morice et al., Eur Respir J 2020; Parker et al., Thorax 2023'}, next:['obj_identify','obj_start_refer','pt_redflags'] },

/* ───────────── TRIAL EVIDENCE ───────────── */
{ id:'ev_design', cat:'ev', q:'Tell me about the COUGH-1 and COUGH-2 trials', s:'COUGH-1 & COUGH-2 design',
  keys:'cough-1 cough1 cough-2 cough2 pivotal phase 3 phase iii trial study design 2044 participants randomised double blind endpoints',
  a:`Phase 3, multinational, randomised, double-blind, placebo-controlled studies in adults with RCC/UCC.
• **2,044** participants – COUGH-1 (n=730), COUGH-2 (n=1,314)
• Arms (1:1:1): Gefapixant **45 mg BID**, **15 mg BID**, placebo
• Primary endpoint: change in 24-hour cough frequency (coughs/hr, from sound recordings) at **12 wks (COUGH-1)** and **24 wks (COUGH-2)**
• Secondary: awake cough frequency, LCQ ≥1.3-pt gain, ≥30% cough reduction, CSD and VAS improvements`,
  src:{t:'ref', r:'McGarvey et al., Lancet 2022;399(10328):909-923'}, next:['ev_primary','ev_measure','ev_pop'] },

{ id:'ev_primary', cat:'ev', q:'What were the primary efficacy results?', s:'Primary efficacy results',
  keys:'primary efficacy results 62 63 percent reduction cough frequency placebo 18.5 14.6 p value confidence interval outcome results data',
  a:`Gefapixant **45 mg BID**:
• **COUGH-1 (12 wks):** 62% reduction in 24-h cough frequency vs baseline; **18.5%** relative reduction vs placebo (95% CI 0.9–32.9; p=0.041)
• **COUGH-2 (24 wks):** 63% reduction vs baseline; **14.6%** relative reduction vs placebo (95% CI 1.4–26.1; p=0.031)`,
  src:{t:'ref', r:'McGarvey et al., Lancet 2022;399(10328):909-923'}, next:['ev_responders','ev_base','obj_small'] },

{ id:'ev_responders', cat:'ev', q:'Responder analysis – how many patients improved substantially?', s:'Responder analysis',
  keys:'responder analysis responders 30 percent 50 percent 70 percent proportion patients improved threshold stricter',
  a:`Proportion of patients on 45 mg BID with a reduction in 24-h cough frequency (COUGH-1 and COUGH-2):
• **COUGH-1 (12 wks):** ≥30% – 69.9% · ≥50% – 54.1% · ≥70% – 33.9%
• **COUGH-2 (24 wks):** ≥30% – 72.9% · ≥50% – 57.6% · ≥70% – 38.2%
The advantage over placebo **widens with stricter thresholds**: COUGH-1 4.0% → 7.8% → 8.2%; COUGH-2 6.0% → 7.4% → 7.9%.`,
  src:{t:'ref', r:'McGarvey et al., Lancet 2022;399(10328):909-923'}, next:['ev_qol','ev_base'] },

{ id:'ev_qol', cat:'ev', q:'Does it improve quality of life?', s:'Quality-of-life results (LCQ)',
  keys:'quality of life qol lcq leicester cough questionnaire secondary endpoint 1.3 points improvement patient reported',
  a:`A greater proportion of patients on 45 mg BID achieved a clinically meaningful **≥1.3-point rise in the Leicester Cough Questionnaire (LCQ)** total score.
Improvements in cough frequency, severity and cough-specific QoL were seen **from week 4** and sustained in both studies.`,
  src:{t:'ref', r:'McGarvey et al., Lancet 2022;399(10328):909-923'}, next:['pt_onset','ev_iiib'] },

{ id:'ev_measure', cat:'ev', q:'How was cough measured – is it objective?', s:'How cough was measured',
  keys:'objective measurement how measured cough counting sound recording 24 hour recording vas diary lcq subjective patient reported endpoint',
  a:`The primary endpoint used **24-hour cough frequency from sound recordings** (objective coughs per hour), alongside patient-reported tools:
• Cough Severity **VAS** (100 mm)
• **Leicester Cough Questionnaire** (LCQ)
• **Cough Severity Diary** (CSD)
**In practice no cough monitor is needed:** record a 0–10 cough severity score and the LCQ at the first visit and at follow-up.`,
  src:{t:'ref', r:'McGarvey et al., Lancet 2022;399(10328):909-923'}, next:['obj_placebo','ev_primary'] },

{ id:'ev_pop', cat:'ev', q:'Who was in the trials – are they like my patients?', s:'Trial population',
  keys:'trial population patients included inclusion criteria who enrolled participants indian patients similar real world like my patients',
  a:`• Adults ≥18 yrs with an RCC/UCC diagnosis
• Chronic cough ≥1 year (average ≈ **11 years**)
• Cough severity VAS ≥40 mm at screening and baseline
• Normal chest X-ray or CT (within 5 years, after cough onset)
These were long-standing, difficult-to-treat patients.`,
  src:{t:'ref', r:'McGarvey et al., Lancet 2022;399(10328):909-923'}, next:['ev_iiib','pt_who'] },

{ id:'ev_iiib', cat:'ev', q:'What is the Phase IIIb study?', s:'Phase IIIb – recent-onset cough',
  keys:'phase iiib 3b recent onset chronic cough rocc 12 months 415 participants study design lung 2023',
  a:`Phase 3b, randomised, double-blind, parallel-group, placebo-controlled study in **recent-onset (≤12 months)** RCC/UCC.
• **N = 415** – Gefapixant 45 mg BID (n=206) vs placebo (n=209)
• Primary: change in total **LCQ** score from baseline to Week 12
• Secondary: change in cough severity VAS at Week 12
• No substantial chest-imaging abnormality contributing to cough`,
  src:{t:'ref', r:'Lung 2023;201(2):111-118'}, next:['ev_iiib_res'] },

{ id:'ev_iiib_res', cat:'ev', q:'Phase IIIb efficacy results', s:'Phase IIIb efficacy results',
  keys:'phase iiib results lcq 0.75 difference week 12 vas 6.92 csd 0.47 recent onset efficacy 4.34 3.59 p 0.034',
  a:`At Week 12 (45 mg BID vs placebo):
• **LCQ total score** – mean change 4.34 vs 3.59; difference **0.75** (95% CI 0.06–1.44), **p=0.034** → superior to placebo
• **Cough severity VAS** – difference −6.92 mm (95% CI −11.88 to −1.97)
• **CSD total score** – difference −0.47 (95% CI −0.88 to −0.06)`,
  src:{t:'ref', r:'Lung 2023;201(2):111-118'}, next:['saf_overview','saf_disc'] },

{ id:'ev_base', cat:'ev', q:'62% vs 18.5% – which number should I quote?', s:'62% vs 18.5% – which to quote?',
  keys:'which number quote 62 18.5 baseline versus placebo adjusted difference explain relative reduction confusing percent',
  a:`Both are true – they answer different questions:
• **62–63%** = fall from the patient’s **own baseline** (what the patient feels)
• **18.5% / 14.6%** = extra relative reduction **versus placebo** (what the drug adds)
Cough trials see a large placebo response, so **quote both** and never hide the placebo-adjusted figure. Doctors respect transparency.`,
  src:{t:'ref', r:'McGarvey et al., Lancet 2022;399(10328):909-923'}, next:['obj_small','ev_responders'] },

{ id:'ev_30s', cat:'ev', q:'Give me a 30-second evidence summary', s:'30-second evidence summary',
  keys:'summary 30 second evidence short recap elevator quick overview trial data',
  a:`Your 30-second evidence line:`,
  say:`In two Phase 3 trials of over 2,000 patients with refractory or unexplained chronic cough, Gefapixant 45 mg twice daily reduced 24-hour cough frequency by 62–63% from baseline, with an 18.5% and 14.6% relative reduction versus placebo, and gains in cough-specific quality of life from week 4. The most common side effects were taste-related; serious adverse events were infrequent.`,
  src:{t:'ref', r:'McGarvey et al., Lancet 2022;399(10328):909-923'}, next:['ev_primary','c_pitch'] },

/* ───────────── SAFETY ───────────── */
{ id:'saf_overview', cat:'saf', q:'What is the safety profile of Gefapixant?', s:'Safety profile overview',
  keys:'safety profile adverse events ae side effects tolerability 52 weeks treatment related serious overview risks',
  a:`52-week data, 45 mg BID vs placebo (COUGH-1 | COUGH-2):
• Taste-related AEs: **59.3% | 68.9%** vs 4.5% | 8.3%
• Treatment-related AEs: 65.0% | 70.9% vs 19.3% | 21.1%
• Serious AEs: 5.3% | 5.7% vs 5.8% | 5.8% – similar to placebo
Most taste AEs were **mild to moderate**; AEs with 45 mg were most commonly taste-related and **dose-dependent**.`,
  src:{t:'ref', r:'McGarvey et al., Lancet 2022;399(10328):909-923'}, next:['saf_taste','saf_serious','obj_taste'] },

{ id:'saf_taste', cat:'saf', q:'How common are taste side effects?', s:'Taste side effects – the numbers',
  keys:'taste side effects dysgeusia ageusia hypogeusia taste disorder altered taste loss of taste metallic bitter percent how common frequency',
  a:`The most common side effect: **58% (COUGH-1) and 69% (COUGH-2)**, mostly mild to moderate – and it **resolved in 96% of patients**. Food may taste bitter or metallic for a while.
52-week data, 45 mg BID (COUGH-1 | COUGH-2):
• Dysgeusia **36.2% | 43.9%**
• Ageusia **13.6% | 15.2%**
• Hypogeusia **5.3% | 13.6%**
• Taste disorder **9.9% | 8.4%**
Taste AEs are **dose-dependent** – any taste-related AE with 15 mg: 12.7% | 20.1%.
Phase IIIb (12 wks): dysgeusia 32.0% vs 3.3%, ageusia 11.7% vs 0%, hypogeusia 10.7% vs 0.5%.`,
  src:{t:'ref', r:'Merck press release, COUGH-1/COUGH-2 results, Sept 2020; McGarvey et al., Lancet 2022;399(10328):909-923; Lung 2023;201(2):111-118'}, next:['saf_counsel','obj_taste'] },

{ id:'saf_counsel', cat:'saf', q:'How should patients be counselled about taste changes?', s:'Counselling patients on taste changes',
  keys:'counsel counselling patient taste change advice what to tell patients manage expectation reassure follow up',
  a:`Suggested doctor–patient conversation:
• Tell patients **on day one** that food may taste bitter or metallic for a while
• Most taste events were **mild to moderate** and **resolved in 96% of patients**
• Warning them up-front stops patients **dropping out quietly**
• Plan a **review visit** – doctor-led awareness videos and a follow-up reminder card can help bring them back`, next:['obj_taste','pt_expect'] },

{ id:'saf_serious', cat:'saf', q:'Are there serious safety concerns?', s:'Serious adverse events',
  keys:'serious adverse events sae serious safety deaths concerns risk severe hospitalisation',
  a:`• **COUGH-1/2 (52 wks):** serious AEs 5.3% and 5.7% on 45 mg vs 5.8% and 5.8% on placebo
• **Phase IIIb (12 wks):** serious AEs 1.5% (45 mg) vs 1.9% (placebo); **no serious drug-related AEs** in either arm
AEs with 45 mg were most commonly taste-related.`,
  src:{t:'ref', r:'McGarvey et al., Lancet 2022;399(10328):909-923; Lung 2023;201(2):111-118'}, next:['saf_disc','saf_long'] },

{ id:'saf_disc', cat:'saf', q:'How many patients stopped treatment because of side effects?', s:'Discontinuations due to AEs',
  keys:'discontinuation discontinued stopped dropout drop out withdraw quit treatment because of adverse events tolerability',
  a:`Phase IIIb (12 weeks), 45 mg BID vs placebo:
• Discontinued due to any AE: **11.2%** vs 1.9%
• Due to a drug-related AE: **8.7%** vs 0.5%
• Due to a serious AE: 0% vs 0.5%
The deck states discontinuations due to AEs were higher with Gefapixant – **be upfront about it**.`,
  src:{t:'ref', r:'Lung 2023;201(2):111-118'}, next:['obj_taste','saf_counsel'] },

{ id:'saf_long', cat:'saf', q:'Is there long-term safety data?', s:'Long-term safety (52 weeks)',
  keys:'long term safety 52 weeks one year duration of treatment how long continue chronic use extended',
  a:`COUGH-1 and COUGH-2 report adverse events **up to 52 weeks**: serious AEs were similar to placebo, and the most common events were taste-related.
The trials studied treatment for up to 52 weeks – the doctor decides at each review whether to continue, based on how much the patient has improved.`,
  src:{t:'ref', r:'McGarvey et al., Lancet 2022;399(10328):909-923'}, next:['obj_long','saf_overview'] },

{ id:'obj_dx', cat:'obj', spec:'pulm', q:'“Refractory cough isn’t a diagnosis. I’ll first rule out asthma, GERD and post-nasal drip.”', s:'“Refractory cough isn’t a diagnosis”',
  keys:'refractory cough not a diagnosis rule out asthma gerd reflux post nasal drip first treat cause underlying work up ppi trial treatable traits diagnose',
  obj:`Refractory cough isn’t a diagnosis. I’ll first rule out asthma, GERD and post-nasal drip.`,
  points:[`The guideline path comes first – treat asthma, reflux and nasal causes`,`Cough lasting **beyond 8 weeks after treating those causes = refractory (RCC)**`,`**No cause found** after a full work-up = unexplained (UCC)`,`Gefacalm is for the patient who is **still coughing after that**`],
  say:`Completely agree, Doctor. Gefacalm is for the patient where you have already done that. If the cough lasts beyond 8 weeks after treating those causes, that is refractory cough. If no cause is found, it is unexplained cough. Which of your patients is still coughing after all that?`,
  proof:[`Morice et al., Eur Respir J 2020 – treatable-traits approach before RCC/UCC`,`Smith et al., ERJ Open Res 2020 – RCC and UCC definitions`],
  hit:[{t:'Agreed the work-up comes first',re:/agree|absolutely|right|first|already done|correct/i},{t:'Defined refractory (beyond 8 weeks after treating causes)',re:/8 weeks|eight weeks|refractory|still cough|persist/i},{t:'Mentioned unexplained cough (no cause found)',re:/unexplained|no cause/i}],
  src:{t:'ref', r:'Morice et al., Eur Respir J 2020;55:1901136; Smith et al., ERJ Open Res 2020;6(4):00284-2020'}, next:['pt_traits','sci_rccucc','pt_finder'] },

/* ═════════ SCORM (1.2 + 2004, auto-detected; silent standalone) ═════════ */
const SC=(function(){
  let api=null,ver=null,ok=false,t0=Date.now(),finished=false;
  function find(w){let n=0;while(w&&n++<12){try{if(w.API_1484_11){ver='2004';return w.API_1484_11}if(w.API){ver='1.2';return w.API}}catch(e){}if(w.parent===w)break;w=w.parent}return null}
  function init(){
    try{
      api=find(window)||(window.opener?find(window.opener):null);
      if(!api)return false;
      ok=String(ver==='2004'?api.Initialize(''):api.LMSInitialize(''))==='true';
      if(ok){
        const st=get(ver==='2004'?'cmi.completion_status':'cmi.core.lesson_status');
        if(!st||st==='not attempted'||st==='unknown')set(ver==='2004'?'cmi.completion_status':'cmi.core.lesson_status','incomplete');
        commit();
      }
      return ok;
    }catch(e){ok=false;return false}
  }
  function get(k){if(!ok)return '';try{return String(ver==='2004'?api.GetValue(k):api.LMSGetValue(k))}catch(e){return ''}}
  function set(k,v){if(!ok)return false;try{return String(ver==='2004'?api.SetValue(k,v):api.LMSSetValue(k,v))==='true'}catch(e){return false}}
  function commit(){if(!ok)return;try{ver==='2004'?api.Commit(''):api.LMSCommit('')}catch(e){}}
  function complete(){
    if(!ok)return;
    set(ver==='2004'?'cmi.completion_status':'cmi.core.lesson_status','completed');
    if(ver==='2004')set('cmi.success_status','passed');
    commit();
  }
  function pad(n,l){n=String(n);while(n.length<l)n='0'+n;return n}
  function sessionTime(){
    const s=Math.max(0,Math.round((Date.now()-t0)/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
    return ver==='2004'?('PT'+h+'H'+m+'M'+sec+'S'):(pad(h,4)+':'+pad(m,2)+':'+pad(sec,2)+'.00');
  }
  function finish(done){
    if(!ok||finished)return;finished=true;
    try{
      set(ver==='2004'?'cmi.session_time':'cmi.core.session_time',sessionTime());
      set(ver==='2004'?'cmi.exit':'cmi.core.exit',done?(ver==='2004'?'normal':''):'suspend');
      commit();
      ver==='2004'?api.Terminate(''):api.LMSFinish('');
    }catch(e){}
  }
  function name(){
    const n=get(ver==='2004'?'cmi.learner_name':'cmi.core.student_name');
    if(!n)return '';
    const m=n.split(',');
    return (m.length>1?m[1]:m[0]).trim().split(/\s+/)[0]||'';
  }
  return{init,get,set,commit,complete,finish,name,status:()=>ok?('SCORM '+ver+' connected'):'Preview mode – no LMS detected',get on(){return ok}};
})();

/* ═════════ STATE (SCORM suspend_data, with localStorage fallback) ═════════ */
const S={seen:[],drills:0,theme:'auto',done:false,auto:false};
function loadState(){
  let raw='';
  if(SC.on)raw=SC.get('cmi.suspend_data');
  else{try{raw=localStorage.getItem('gefacalm_coach')||''}catch(e){}}
  if(raw){try{const o=JSON.parse(raw);if(o&&typeof o==='object'){S.seen=Array.isArray(o.s)?o.s:[];S.drills=o.d|0;S.theme=o.t||'auto';S.done=!!o.c;S.auto=!!o.a}}catch(e){}}
  if(SC.on){const a=SC.get('cmi.core.lesson_status'),b=SC.get('cmi.completion_status');if(a==='completed'||a==='passed'||b==='completed')S.done=true}
}
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    const raw=JSON.stringify({s:S.seen,d:S.drills,t:S.theme,c:S.done?1:0,a:S.auto?1:0});
    try{localStorage.setItem('gefacalm_coach',raw)}catch(e){}
    if(SC.on){SC.set('cmi.suspend_data',raw);SC.commit()}
  },250);
}

const STOP=new Set('a an the is are was were be been am of to in on for and or with what how why when who which do does did can could should would i me my you your it its this that these those about at as by from if into than then there their they them we our us so tell give show explain please any some more also just very really want need know like get got say says said doctor doc he she him her very much thing things same'.split(' '));
function stem(w){
  if(w.length>4){
    if(w.endsWith('ies'))w=w.slice(0,-3)+'y';
    else if(w.endsWith('s')&&!/(ss|us|is)$/.test(w))w=w.slice(0,-1);
  }
  if(w.length>5&&w.endsWith('ing'))w=w.slice(0,-3);
  else if(w.length>4&&w.endsWith('ed'))w=w.slice(0,-2);
  if(w.length>4&&w.endsWith('e'))w=w.slice(0,-1);
  return w;
}
const SYN=(function(){
  const g={
    cost:'price pricing expensive costly afford affordable cheap cheaper money',
    tb:'tuberculosis',
    dose:'dosage dosing posology regimen',
    taste:'dysgeusia ageusia hypogeusia metallic bitter',
    ae:'adverse sae saes aes',
    renal:'kidney',liver:'hepatic',pregnancy:'pregnant lactation breastfeeding',
    opioid:'morphine codeine',
    competitor:'camlipixant eliapixant sivopixant competing competition',
    discontinue:'quit stopped stop dropout withdraw discontinued discontinuation',
    fda:'usa rejected',
    placebo:'sham',
    interaction:'interactions concomitant',
    elderly:'geriatric old',
    mechanism:'moa',
    pitch:'elevator',
    busy:'hurry'
  };
  const m={};
  for(const k in g)g[k].split(' ').forEach(w=>{m[stem(w)]=stem(k)});
  return m;
})();
function rawTok(text){
  return (String(text).toLowerCase().replace(/[’']/g,'').replace(/([a-z])-(\d)/g,'$1$2').match(/[a-z][a-z0-9]*|\d+(?:\.\d+)?/g)||[])
    .filter(w=>!STOP.has(w))
    .map(w=>{const s=stem(w);return SYN[s]||s});
}
let VOCAB=new Set(),IDF={},MAXIDF=1;
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max)return max+1;
  let prev=[],cur=[];
  for(let j=0;j<=b.length;j++)prev[j]=j;
  for(let i=1;i<=a.length;i++){
    cur=[i];let min=i;
    for(let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(cur[j]<min)min=cur[j];
    }
    if(min>max)return max+1;
    prev=cur;
  }
  return prev[b.length];
}
function fix(t){
  if(VOCAB.has(t)||t.length<6||/\d/.test(t))return t;
  const max=t.length>=8?2:1;let best=null,bd=max+1;
  for(const v of VOCAB){const d=lev(t,v,max);if(d<bd){bd=d;best=v;if(d===1&&max===1)break}}
  return best&&bd<=max?best:t;
}
function tok(text){return rawTok(text).map(fix)}
function prepKB(KBX){
  const df={};
  KBX.forEach(e=>{
    e._k=new Set(rawTok(e.keys||''));
    e._q=new Set(rawTok((e.q||'')+' '+(e.s||'')+' '+(e.obj||'')));
    e._b=new Set(rawTok((e.a||'')+' '+(e.say||'')+' '+(e.points?e.points.join(' '):'')));
    const u=new Set([...e._k,...e._q,...e._b]);
    u.forEach(t=>{df[t]=(df[t]||0)+1;VOCAB.add(t)});
    e._kp=[...e._k,...e._q];
  });
  const N=KBX.length;MAXIDF=Math.log(N)+1;
  for(const t in df)IDF[t]=Math.log(N/df[t])+1;
}
const ANS_T=10,SUG_T=4;
function scoreAll(KBX,query,prefixLast){
  const qt=tok(query);if(!qt.length)return [];
  const intent=/\b(objection|objects?|says?|saying|handle|respond|reply|counter|pushback)\b/i.test(query);
  const out=[];
  KBX.forEach(e=>{
    let s=0,hit=0,strong=0,hw=0,tw=0;
    qt.forEach((t,i)=>{
      const idf=IDF[t]||MAXIDF;let w=0;tw+=idf;
      if(e._k.has(t))w+=4;
      if(e._q.has(t))w+=3;
      if(!w&&e._b.has(t))w+=.7;
      if(!w&&prefixLast&&i===qt.length-1&&t.length>=3&&e._kp.some(k=>k.startsWith(t)))w+=2;
      if(w){s+=w*idf;hit++;hw+=idf;if(w>=2)strong++}
    });
    if(!hit)return;
    const cov=hw/tw;
    s*=(0.45+cov);
    if(intent&&e.cat==='obj')s*=1.6;
    out.push({e,s,cov,hit,strong,n:qt.length});
  });
  return out.sort((a,b)=>b.s-a.s);
}
function isAnswer(r){return !!r&&r.s>=ANS_T&&r.cov>.5&&r.strong>=1}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(s){
  return String(s).split('\n').map(l=>{
    if(!l.trim())return '<div class="gap"></div>';
    let t=esc(l).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>');
    if(l.startsWith('• '))return '<div class="bl"><span>•</span><span>'+t.slice(2)+'</span></div>';
    if(l.startsWith('– '))return '<div class="sb"><span>–</span><span>'+t.slice(2)+'</span></div>';
    const m=l.match(/^(\d+)\. /);
    if(m)return '<div class="bl"><span>'+m[1]+'.</span><span>'+t.replace(/^\d+\. /,'')+'</span></div>';
    return '<div class="ln">'+t+'</div>';
  }).join('');
}
function plain(h){return String(h).replace(/<[^>]*>/g,'')}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const timeStr=()=>new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const SPK={};let SPKN=0;
function toSpeech(html){
  const d=document.createElement('div');d.innerHTML=html;
  d.querySelectorAll('.src,.cp,.sayh,.docname,.ttl,.ph,.spk,.meta').forEach(n=>n.remove());
  d.querySelectorAll('div,li,p').forEach(n=>n.appendChild(document.createTextNode('. ')));
  d.querySelectorAll('span,b').forEach(n=>n.appendChild(document.createTextNode(' ')));
  let t=d.textContent;
  t=t.replace(/twice daily \(BID\)|45 mg BID/g,m=>m==='45 mg BID'?'45 mg twice daily':'twice daily').replace(/Gefacalm/g,'Gefa calm')
   .replace(/\bCOUGH-?(\d)/g,'Cough $1')
   .replace(/\bP2X2\/3/g,'P 2 X 2 slash 3').replace(/\bP2X3/g,'P 2 X 3')
   .replace(/\bPhase IIIb\b/g,'Phase 3 b').replace(/\bIIIb\b/g,'3 b').replace(/\bPhase III\b/g,'Phase 3')
   .replace(/\bBID\b/g,'twice daily')
   .replace(/\bAEs\b/g,'adverse events').replace(/\bAE\b/g,'adverse event')
   .replace(/\bQoL\b/g,'quality of life')
   .replace(/\b(RCC|UCC|CHS|LCQ|VAS|CSD|ATP|PPI|ICS|ILD|PFT|TB|ERS|ERJ|EU|CI|UACS|NAEB|CRC)\b/g,m=>m.split('').join(' '))
   .replace(/(\d)\s*mg\b/g,'$1 milligrams').replace(/(\d)\s*mm\b/g,'$1 millimetres')
   .replace(/(\d+)-h\b/g,'$1 hour').replace(/\bwks?\b/gi,'weeks').replace(/\byrs?\b/gi,'years')
   .replace(/\bvs\.?(?=\s)/gi,'versus').replace(/\be\.g\./g,'for example')
   .replace(/p\s*=\s*0/gi,'p equals 0')
   .replace(/−(\d)/g,'minus $1')
   .replace(/%/g,' percent')
   .replace(/≥\s*/g,'at least ').replace(/≤\s*/g,'at most ').replace(/>\s*(\d)/g,'more than $1').replace(/<\s*(\d)/g,'less than $1')
   .replace(/~\s*/g,'about ')
   .replace(/(\d)\s*[–-]\s*(\d)/g,'$1 to $2')
   .replace(/Na⁺/g,'sodium').replace(/Ca²⁺/g,'calcium')
   .replace(/→/g,', then ').replace(/[↓↑]/g,' ')
   .replace(/\|/g,' and ').replace(/\//g,' or ')
   .replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\u2B50\uFE0F\u200D•]/gu,' ')
   .replace(/[“”"*_#]/g,'')
   .replace(/\s*[–—]\s*/g,', ')
   .replace(/&/g,' and ')
   .replace(/\s+/g,' ')
   .replace(/\s+([.,;:?!])/g,'$1').replace(/\?\./g,'?').replace(/(\.\s*)+\./g,'.').replace(/,\s*\./g,'.').replace(/:\s*\./g,'.').replace(/\.\s*,/g,'.');
  return t.trim();
}
const TTS=(function(){
  const ok=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
  let voice=null,gen=0,queue=[],playing=null,busy=false,keep=null;
  function pick(){
    if(!ok)return;const vs=speechSynthesis.getVoices()||[];if(!vs.length)return;
    voice=vs.find(v=>/^en[-_]IN$/i.test(v.lang))||vs.find(v=>/^en[-_]GB$/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
  }
  if(ok){pick();if(speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',pick);else speechSynthesis.onvoiceschanged=pick}
  function chunks(text){
    const P='\u0001',sents=(text.replace(/(\d)\.(\d)/g,'$1'+P+'$2').match(/[^.!?;]+[.!?;]*/g)||[text]).map(s=>s.split(P).join('.')),out=[];let cur='';
    sents.forEach(s=>{
      s=s.trim();if(!s)return;
      if(s.length>200){s.split(/,\s*/).forEach(p=>{if((cur+' '+p).length>170){if(cur)out.push(cur);cur=p}else cur=(cur+' '+p).trim()});return}
      if((cur+' '+s).length>170){out.push(cur);cur=s}else cur=(cur+' '+s).trim();
    });
    if(cur)out.push(cur);return out;
  }
  function mark(){
    document.querySelectorAll('.spk').forEach(b=>{
      const on=playing!=null&&String(playing)===b.dataset.spk;
      b.classList.toggle('on',on);b.textContent=on?'⏹':'🔊';
      b.setAttribute('aria-label',on?'Stop reading':'Read aloud');
    });
  }
  function next(){
    if(busy)return;
    const item=queue[0];
    if(!item){playing=null;mark();return}
    if(!item.parts.length){queue.shift();return next()}
    busy=true;playing=item.id;mark();
    const my=gen,part=item.parts.shift(),u=new SpeechSynthesisUtterance(part);
    u.lang=voice?voice.lang:'en-IN';if(voice)u.voice=voice;u.rate=.95;u.pitch=1;
    const done=()=>{if(my!==gen)return;busy=false;next()};
    u.onend=done;u.onerror=done;keep=u;
    try{speechSynthesis.speak(u)}catch(e){busy=false}
  }
  function stop(){gen++;queue=[];busy=false;playing=null;if(ok){try{speechSynthesis.cancel()}catch(e){}}mark()}
  function speak(id,text,append){
    if(!ok||!text)return false;
    if(!append)stop();
    queue.push({id,parts:chunks(text)});
    if(!busy)setTimeout(next,append?0:90);
    return true;
  }
  return{ok,speak,stop,say:t=>speak(null,t,false),get playing(){return playing}};
})();

/* ═════════ CHAT RENDERING (queued so order is always natural) ═════════ */
let Q=Promise.resolve(),pending=0,rush=false;
const sleep=ms=>new Promise(r=>setTimeout(r,(FAST||rush)?0:ms));
function enqueue(fn){
  pending++;
  Q=Q.then(fn).catch(e=>console.error(e)).then(()=>{pending--;if(!pending)rush=false});
  return Q;
}
function scrollChat(node){
  requestAnimationFrame(()=>{
    const tall=node&&node.offsetHeight>chat.clientHeight*.78;
    if(tall)chat.scrollTo({top:node.offsetTop-8,behavior:FAST?'auto':'smooth'});
    else chat.scrollTo({top:chat.scrollHeight,behavior:FAST?'auto':'smooth'});
  });
}
function removeChips(){chat.querySelectorAll('.chips').forEach(c=>c.remove())}
function mkRow(side){const r=document.createElement('div');r.className='row '+side;return r}
function userMsg(text){
  return enqueue(async()=>{
    TTS.stop();removeChips();
    const r=mkRow('me');
    r.innerHTML='<div class="bubble">'+esc(text)+'<div class="meta">'+timeStr()+' <span class="tick">✓✓</span></div></div>';
    chat.appendChild(r);scrollChat(r);
    await sleep(250);
  });
}
function say(t,opts){return bot(fmt(t),opts)}
function bot(html,opts){
  opts=opts||{};
  return enqueue(async()=>{
    const t=mkRow('bot');t.classList.add('typing');t.setAttribute('aria-hidden','true');
    t.innerHTML='<div class="bubble"><i></i><i></i><i></i></div>';
    chat.appendChild(t);scrollChat(t);
    await sleep(opts.wait!=null?opts.wait:clamp(380+plain(html).length*2.2,500,1100));
    t.remove();
    let sid=null,btn='';
    if(opts.speak&&TTS.ok){sid=++SPKN;SPK[sid]=toSpeech(html);btn='<button type="button" class="spk" data-spk="'+sid+'" aria-label="Read aloud" title="Read aloud">🔊</button>'}
    const r=mkRow('bot');
    r.innerHTML='<div class="bubble '+(opts.cls||'')+'">'+html+'<div class="meta">'+btn+timeStr()+'</div></div>';
    chat.appendChild(r);scrollChat(r);
    if(sid!=null&&S.auto&&SPK[sid])TTS.speak(sid,SPK[sid],true);
  });
}
function chips(list){
  return enqueue(async()=>{
    removeChips();
    const c=document.createElement('div');c.className='chips';
    list.forEach(x=>{
      const b=document.createElement('button');b.type='button';b.className='chip'+(x.cls?' '+x.cls:'');b.textContent=x.label;

function cardRow(html){

/* ═════════ ANSWER PARTS ═════════ */
function srcTag(src){
  if(!src||!src.r)return '';
  return '<div class="src ref"><b>📚 Reference</b><span>'+esc(src.r)+'</span></div>';
}
function sayCard(text){
  return '<div class="say"><div class="sayh"><span>🎤 Say it like this</span><button class="cp" type="button" data-copy="'+encodeURIComponent(text)+'" aria-label="Copy talk track">Copy</button></div><div class="sayt">“'+esc(text)+'”</div></div>';
}
function proofCard(e){
  let h='<div class="proof"><div class="ph">📌 Proof you can quote</div>'+(e.proof||[]).map(p=>'<div class="bl"><span>•</span><span>'+esc(p)+'</span></div>').join('')+'</div>';
  if(e.avoid)h+='<div class="avoid">🚫 <b>Avoid:</b> '+esc(e.avoid)+'</div>';
  return h+srcTag(e.src);
}
function handleBlock(e){
  let s;
  if(e.ack&&e.explore){
    s='**How to handle it (LAER)**\n• **Listen & Acknowledge** – '+e.ack+'\n• **Explore** – ask: '+e.explore+'\n• **Respond** with:\n'+e.points.map(p=>'– '+p).join('\n');
  }else{
    s='**Key points to land**\n'+e.points.map(p=>'• '+p).join('\n');
  }
  return fmt(s);
}
function nextChips(e,extra){
  const list=[];
  (e.next||[]).forEach(id=>{
    if(id==='DRILL')list.push({label:'🎯 Try the objection drill',cls:'pri',fn:()=>startDrill()});
    else if(byId[id])list.push({label:(byId[id].cat==='obj'?'🗣 ':'')+(byId[id].s||byId[id].q),fn:()=>ask(byId[id],true)});
  });
  if(extra)list.push(...extra);
  list.push({label:'📚 More topics',fn:()=>showTopics()});
  return list.slice(0,5);
}
function markSeen(id){
  if(!S.seen.includes(id)){
    S.seen.push(id);updateRing();
    if(!S.done&&S.seen.length>=COMPLETE_AFTER){
      S.done=true;SC.complete();updateRing();
      say('🎉 **Module complete!** You’ve worked through '+S.seen.length+' coaching answers. I’ll keep going as long as you like – the best way to get sharper is the **objection drill**.',{wait:500});
    }
    save();
  }
}
function answerParts(e){
  if(e.card==='facts'){
    bot('<b>📌 Quick facts</b><div class="tiles">'+e.tiles.map(t=>'<div class="tile"><b>'+esc(t[0])+'</b><span>'+esc(t[1])+'</span></div>').join('')+'</div>'+srcTag(e.src),{cls:'card',wait:500,speak:true});
    return;
  }
  if(e.cat==='obj'){
    bot('<div class="docname">🩺 Doctor says</div><div class="docq">“'+esc(e.obj)+'”</div>',{cls:'doctor',wait:450,speak:true});
    bot(handleBlock(e),{cls:'card',speak:true});
    bot(sayCard(e.say),{cls:'card',wait:600,speak:true});
    bot(proofCard(e),{cls:'card',wait:500});
    return;
  }
  bot('<div class="ttl">'+esc(e.q)+'</div>'+fmt(e.a)+(e.say?'':srcTag(e.src)),{wait:e.say?600:undefined,speak:true});
  if(e.say){
    bot(sayCard(e.say)+srcTag(e.src),{cls:'card',wait:600,speak:true});
  }
}
function ask(e,fromChip){
  if(drill)endDrill(true);
  const label=(e.cat==='obj'?'Objection: ':'')+(e.s||e.q).replace(/^“|”$/g,'');
  userMsg(label);
  answerParts(e);
  markSeen(e.id);
  chips(nextChips(e));
}

function showTopics(){

function specOf(e){return Array.isArray(e.spec)?e.spec[0]:(e.spec||'any')}
function showCat(id){
  const c=catById[id];if(!c)return;
  userMsg(c.ico+' '+c.name);
  const items=KB.filter(e=>e.cat===id);
  let rows='';
  const row=e=>'<button class="li" type="button" data-id="'+e.id+'"><span class="t">'+esc(e.s||e.q)+'</span><span>›</span></button>';

}

/* ═════════ OBJECTION DRILL ═════════ */
let drill=null,bag=[],drillSpec='mix';
const ACK=/(fair|valid|understand|appreciate|good (point|question)|great question|you.?re right|you are right|agree|absolutely|makes sense|i hear|true|of course|sure|sensible|exactly the right|completely)/i;
const EVID=/(\d|percent|%|trial|study|studies|cough[- ]?1|cough[- ]?2|phase|data|evidence|placebo|guideline|approved|label|interaction)/i;
function inSpec(e,k){const sp=Array.isArray(e.spec)?e.spec:[e.spec||'any'];return sp.includes(k)||sp.includes('any')}
function nextObjection(){
  if(!bag.length){
    const pool=KB.filter(e=>e.cat==='obj'&&(drillSpec==='mix'||inSpec(e,drillSpec)));
    bag=shuffle(pool.map(e=>e.id));
  }
  return byId[bag.pop()];
}
function startDrill(){
  drill=null;
  userMsg('🎯 Start objection drill');
  say('**Objection drill** 🎯 I’ll play the doctor. Answer in your own words – acknowledge, respond with proof, and check back. I’ll score you on the key points, then show the model answer.\n**Which doctor are you meeting?**',{wait:700});
  chips(Object.keys(SPECS).filter(k=>k!=='any').map(k=>({label:SPECS[k].ico+' '+SPECS[k].short,fn:()=>beginDrill(k)})).concat([{label:'🎲 Mix of all',cls:'pri',fn:()=>beginDrill('mix')}]));
}
function beginDrill(sp){
  drillSpec=sp;bag=[];
  userMsg(sp==='mix'?'🎲 Mix of all':SPECS[sp].ico+' '+SPECS[sp].name);
  drillAsk();
}
function drillAsk(){
  const e=nextObjection();drill={id:e.id,attempted:false};
  const who=e.who||(drillSpec!=='mix'&&SPECS[drillSpec]?SPECS[drillSpec].doc:SPECS[specOf(e)].doc);
  bot('<div class="docname">🩺 Dr. · '+who+'</div><div class="docq">“'+esc(e.obj)+'”</div>',{cls:'doctor',wait:700,speak:true});
  say('**Your turn.** Type how you’d respond – or tap **Reveal** to see the model answer.',{wait:500});
  chips([{label:'💡 Reveal model answer',cls:'pri',fn:()=>drillReveal()},{label:'⏭ Skip',fn:()=>{userMsg('Skip');drillAsk()}},{label:'✖ End drill',fn:()=>{userMsg('End drill');endDrill()}}]);
}
function drillReveal(attemptText){
  if(!drill)return;
  const e=byId[drill.id];
  if(!attemptText)userMsg('Reveal the model answer');
  S.drills++;save();
  say(attemptText?'**Model answer to compare with yours** 👇':'**Model answer** 👇',{wait:450});
  bot(handleBlock(e),{cls:'card',speak:true});
  bot(sayCard(e.say),{cls:'card',wait:600,speak:true});
  bot(proofCard(e),{cls:'card',wait:500});
  markSeen(e.id);
  chips([{label:'➡ Next objection',cls:'pri',fn:()=>{userMsg('Next objection');drillAsk()}},{label:'✖ End drill',fn:()=>{userMsg('End drill');endDrill()}},{label:'📚 Topics',fn:()=>showTopics()}]);
  drill={id:e.id,attempted:true,done:true};
}
function drillEvaluate(text){
  const e=byId[drill.id];
  const words=text.trim().split(/\s+/).length;
  if(words<5){
    say('Give me a fuller response – at least a sentence or two, as you would say it to the doctor. Or tap **Reveal**.',{wait:450});
    chips([{label:'💡 Reveal model answer',cls:'pri',fn:()=>drillReveal()},{label:'⏭ Skip',fn:()=>{userMsg('Skip');drillAsk()}},{label:'✖ End drill',fn:()=>{userMsg('End drill');endDrill()}}]);
    return;
  }
  const checks=[{t:'Acknowledged the concern',re:ACK},{t:'Backed it with data / evidence',re:EVID}].concat(e.hit||[]).concat([{t:'Asked a question / checked back',re:/\?/}]);
  const seen={},uniq=checks.filter(c=>!seen[c.t]&&(seen[c.t]=1));
  const res=uniq.map(c=>({t:c.t,ok:c.re.test(text)}));
  const n=res.filter(r=>r.ok).length,pct=n/res.length;
  const verdict=pct>=.8?'Strong response 💪':pct>=.5?'Good start 👍 – a few gaps to close':'Let’s sharpen this – see what was missing';
  bot('<div class="ttl">📋 Coach scorecard: '+n+'/'+res.length+'</div><div class="score">'+res.map(r=>'<div><span>'+(r.ok?'✅':'⬜')+'</span><span>'+esc(r.t)+'</span></div>').join('')+'</div><div style="margin-top:6px"><b>'+verdict+'</b></div>',{cls:'card',wait:700});
  drillReveal(text);
}
function endDrill(silent){
  if(!drill)return;
  drill=null;
  if(!silent){
    say('Nice work 👏 You’ve practised **'+S.drills+'** objection'+(S.drills===1?'':'s')+' so far. Come back any time – repetition is what makes these answers automatic.',{wait:600});
    chips(mainChips());
  }
}

  const list=[];
  near.slice(0,3).forEach(r=>list.push({label:r.e.s||r.e.q,fn:()=>ask(r.e)}));

const GREET=/^(hi|hii+|hello|hey|hola|namaste|good (morning|afternoon|evening)|yo)\b/i;
const THANKS=/^(thanks?|thank you|thx|ty|great|awesome|nice|cool|ok(ay)?|got it|perfect)\b/i;
const BYE=/^(bye|goodbye|see you|exit|quit)\b/i;
function handleText(raw){
  const text=raw.trim();if(!text)return;
  if(text.length>300)return;
  userMsg(text);
  const lc=text.toLowerCase();
  if(drill){
    if(/^(reveal|show( me)?( the)? answer|answer|hint|model answer|help)/.test(lc)){return drillReveal(true)}
    if(/^(skip|next)/.test(lc)){return drillAsk()}
    if(/^(stop|end|exit|quit|done|finish)/.test(lc)){return endDrill()}
    if(drill.done){drill=null}else{return drillEvaluate(text)}
  }
  if(/^(menu|topics?|browse|categories|home)\b/.test(lc))return showTopics();
  if(/^(drill|practice|practise|objection (drill|practice|practise)|roleplay|role play|test me|quiz( me)?)/.test(lc))return startDrill();
  if(/^(facts?|quick facts|cheat ?sheet|numbers)\b/.test(lc))return answerEntry(byId.c_facts);
  if(/^(help|what can you do|how (does this|do you) work|\?)/.test(lc)){
    say('I can help with five things:\n• **Science** – cough reflex, CHS, P2X3, mechanism\n• **Evidence** – COUGH-1/2 and Phase IIIb numbers\n• **Safety** – taste events, serious AEs, counselling\n• **Objections** – what doctors say and how to answer\n• **Call craft** – openers, probing, pitch, closing\nJust type a question, or try the **objection drill**.',{wait:600});
    return chips(mainChips());
  }
  if(/^(clear|reset|restart|new chat|start over)\b/.test(lc))return newChat();
  if(GREET.test(lc)&&lc.split(/\s+/).length<=4){say('Hi 👋 What would you like to work on?',{wait:400});return chips(mainChips())}
  if(THANKS.test(lc)&&lc.split(/\s+/).length<=4){say('Anytime! Want to test yourself with an objection?',{wait:400});return chips([{label:'🎯 Objection drill',cls:'pri',fn:()=>startDrill()},{label:'📚 Browse topics',fn:()=>showTopics()}])}
  if(BYE.test(lc)){say('Good luck on your calls! 🍀 Come back anytime.',{wait:400});return}
  const res=scoreAll(KB,text,false);
  const top=res[0];
  if(isAnswer(top)){
    answerParts(top.e);markSeen(top.e.id);
    const alt=res.slice(1,3).filter(r=>r.s>=top.s*.6&&r.e.id!==top.e.id&&!(top.e.next||[]).includes(r.e.id)).map(r=>({label:(r.e.cat==='obj'?'🗣 ':'')+(r.e.s||r.e.q),fn:()=>ask(r.e)}));
    chips(nextChips(top.e,alt.slice(0,1)));
  }else if(top&&top.s>=SUG_T&&top.strong>=1){
    say('I’m not sure I caught that. Did you mean one of these?',{wait:500});
    chips(res.slice(0,3).map(r=>({label:(r.e.cat==='obj'?'🗣 ':'')+(r.e.s||r.e.q),fn:()=>ask(r.e)})).concat([{label:'📚 Browse topics',fn:()=>showTopics()}]));
  }else fallback(text,res);
}

}

   '<button class="mi" data-m="drill"><span class="e">🎯</span><span>Objection drill<small>Practise answering a doctor and get scored</small></span></button>'+
   '<button class="mi" data-m="facts"><span class="e">📌</span><span>Quick-facts card</span></button>'+
   '<button class="mi" data-m="progress"><span class="e">📈</span><span>My progress<small>'+Math.min(S.seen.length,COMPLETE_AFTER)+' of '+COMPLETE_AFTER+' needed for completion'+(S.done?' · ✓ complete':'')+'</small></span></button>'+
   '<button class="mi" data-m="theme"><span class="e">🌓</span><span>Theme: '+th+'<small>Tap to switch Auto / Light / Dark</small></span></button>'+
   (TTS.ok?'<button class="mi" data-m="auto"><span class="e">🔊</span><span>Auto-read answers: '+(S.auto?'On':'Off')+'<small>Reads each answer aloud as it appears</small></span></button>':'')+
   '<button class="mi" data-m="new"><span class="e">🧹</span><span>New chat</span></button>'+
   '<button class="mi" data-m="about"><span class="e">ℹ️</span><span>About & sources</span></button>');
}
function aboutSheet(){
  openSheet('<div class="sh">About Gefacalm Coach</div><div class="about">'+
   '<p>A training companion for Gefapixant (Gefacalm): science, trial evidence, safety, doctor objections and call craft.</p>'+
   '<h4>Where answers come from</h4>'+
   '<p>Every clinical fact comes from the Gefacalm medical presentation, the Gefacalm Objection Handling Guide and the publications they cite – McGarvey (Lancet 2022), the Merck COUGH-1/2 press release (2020), the Lyfnua EU SmPC, Morice (ERS guideline 2020), Parker (Thorax 2023), Markham (Drugs 2022), Chung (Nat Rev Dis Primers 2022), Lung 2023 and others. Each answer shows its reference.</p>'+
   '<p>The call-craft tips (LAER, probing questions, closing) are selling-skill frameworks built around those facts.</p>'+
   '<h4>How it works</h4>'+
   '<p>It answers from a curated offline knowledge base – no generative AI at run-time, and your questions are not sent anywhere. If something isn’t in the content, it says so.</p>'+
   '<h4>Voice</h4><p>🔊 Read-aloud uses the voices already on your phone or browser – free and works offline. Voice quality depends on the device.</p><p>🎤 To speak a question, tap the microphone on your phone keyboard (most accurate), or use the 🎤 button here where your browser supports it.</p>'+
   '<h4>Status</h4><p>v'+VERSION+' · '+esc(SC.status())+'</p></div>');
}
function progressMsg(){
  userMsg('📈 My progress');
  const n=Math.min(S.seen.length,COMPLETE_AFTER),pct=Math.round(n/COMPLETE_AFTER*100);
  bot('<b>Your progress</b><div class="bar"><i style="width:'+pct+'%"></i></div>'+n+' of '+COMPLETE_AFTER+' answers explored · '+S.drills+' objection'+(S.drills===1?'':'s')+' practised'+(S.done?'\n':'')+(S.done?'<div style="margin-top:4px"><b>✓ Module complete</b></div>':'<div style="margin-top:4px">Explore '+(COMPLETE_AFTER-n)+' more to complete the module.</div>'),{wait:500});
  chips(mainChips());
}

/* ═════════ EVENTS ═════════ */
form.addEventListener('submit',ev=>{
  ev.preventDefault();
  const v=inp.value;if(!v.trim())return;
  inp.value='';hideSuggest();
  if(pending)rush=true;
  handleText(v);
  inp.focus({preventScroll:true});
});
function hideSuggest(){sugg.hidden=true;short.hidden=false}
inp.addEventListener('input',()=>{
  const v=inp.value.trim();
  if(v.length<2||drill&&!drill.done){hideSuggest();return}
  const res=scoreAll(KB,v,true).filter(r=>r.s>=SUG_T*.6&&r.strong>=1).slice(0,3);
  if(!res.length){hideSuggest();return}
  sugg.innerHTML=res.map(r=>'<button type="button" class="sg" data-id="'+r.e.id+'"><i>'+(r.e.cat==='obj'?'🗣':catById[r.e.cat].ico)+'</i><span>'+esc(r.e.s||r.e.q)+'</span></button>').join('');
  sugg.hidden=false;short.hidden=true;
});
sugg.addEventListener('click',ev=>{
  const b=ev.target.closest('.sg');if(!b)return;
  inp.value='';hideSuggest();if(pending)rush=true;ask(byId[b.dataset.id]);
});
chat.addEventListener('click',ev=>{
  const li=ev.target.closest('.li');
  if(li){if(pending)rush=true;return ask(byId[li.dataset.id])}
  const cat=ev.target.closest('.cat');
  if(cat){if(pending)rush=true;return showCat(cat.dataset.cat)}
  const sp=ev.target.closest('.spk');
  if(sp){
    const id=sp.dataset.spk;
    if(TTS.playing!=null&&String(TTS.playing)===id)TTS.stop();
    else if(!TTS.speak(+id,SPK[id]))toast('Read-aloud isn’t supported on this device');
    return;
  }
  const cp=ev.target.closest('.cp');
  if(cp){
    const t=decodeURIComponent(cp.dataset.copy);
    const done=()=>{toast('Talk-track copied');cp.textContent='Copied ✓'};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done))}else fallbackCopy(t,done);
  }
});
function fallbackCopy(t,done){
  try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();done()}catch(e){toast('Press and hold to copy')}
}
short.addEventListener('click',ev=>{
  const b=ev.target.closest('.pill');if(!b)return;
  const a=b.dataset.act;if(pending)rush=true;
  if(a==='topics')showTopics();
  else if(a==='drill')startDrill();
  else if(a==='facts')ask(byId.c_facts);
  else if(a==='pitch')ask(byId.c_pitch);
});
$('#menuBtn').addEventListener('click',menuSheet);
$('#ringBtn').addEventListener('click',()=>{progressMsg()});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('#sheet').addEventListener('click',ev=>{
  const b=ev.target.closest('.mi');if(!b)return;
  const m=b.dataset.m;
  if(m==='theme'){S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto';applyTheme();save();menuSheet();return}
  if(m==='auto'){S.auto=!S.auto;save();if(S.auto)TTS.say('Auto read is on');else TTS.stop();menuSheet();return}
  closeSheet();
  if(pending)rush=true;
  if(m==='topics')showTopics();
  else if(m==='drill')startDrill();
  else if(m==='facts')ask(byId.c_facts);
  else if(m==='progress')progressMsg();
  else if(m==='new')newChat();
  else if(m==='about')aboutSheet();
});
if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='auto')applyTheme()})}catch(e){}

/* voice input (where the browser/webview supports it) */
(function(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const mic=$('#mic');if(!SR)return;
  mic.hidden=false;
  const PH=inp.placeholder;let rec=null,finalText='';
  mic.addEventListener('click',()=>{
    if(mic.classList.contains('on')){try{rec&&rec.stop()}catch(e){}return}
    TTS.stop();
    try{
      rec=new SR();rec.lang='en-IN';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;finalText='';
      rec.onstart=()=>{mic.classList.add('on');inp.placeholder='Listening… speak now'};
      rec.onresult=e=>{
        let interim='';finalText='';
        for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalText+=r[0].transcript;else interim+=r[0].transcript}
        inp.value=(finalText+' '+interim).trim();inp.dispatchEvent(new Event('input'));
      };
      rec.onerror=e=>{
        mic.classList.remove('on');
        const m=(e.error==='not-allowed'||e.error==='service-not-allowed')?'Mic blocked – use the 🎤 on your keyboard instead':(e.error==='no-speech'?'Didn’t hear anything – try again':'Mic not available – use the 🎤 on your keyboard');
        toast(m);
      };
      rec.onend=()=>{
        mic.classList.remove('on');inp.placeholder=PH;
        if(finalText.trim()&&inp.value.trim()){form.requestSubmit?form.requestSubmit():form.dispatchEvent(new Event('submit',{cancelable:true}))}
      };
      rec.start();
    }catch(e){toast('Mic not available – use the 🎤 on your keyboard')}
  });
})();

/* ═════════ BOOT ═════════ */
SC.init();
loadState();
applyTheme();updateRing();
$('#status').textContent=SC.on?'online · connected to LMS':'online · science · evidence · objections';
window.addEventListener('pagehide',()=>{TTS.stop();SC.finish(S.done)});
window.addEventListener('beforeunload',()=>{SC.finish(S.done)});
newChat();
window.__gc={S,KB,scoreAll:(q)=>scoreAll(KB,q,false),handleText,toSpeech,SPK};
})();
</script>
