<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2f3d94">
<title>Gefacalm Coach</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{
  --hdr:#2f3d94;--hdr-tx:#fff;--bg:#efe7dc;--dot:rgba(47,61,148,.07);
  --in:#fff;--out:#d9fdd3;--doc:#e8f0fe;--doc-line:#4a7bd8;
  --tx:#111b21;--mut:#667781;--acc:#4d8a1e;--acc-d:#3b6c16;
  --card:#fff;--line:rgba(17,27,33,.12);
  --say:#eef6e3;--proof:#eef1fb;--avoid:#fdecec;--avoid-tx:#9b1c1c;
  --chip:#fff;--chip-tx:#2f3d94;--chip-line:rgba(47,61,148,.35);
  --sheet:#fff;--field:#fff;--bar:#f0f2f5;
  --t-deck:#0f7a3d;--t-deck-bg:#e3f6ea;--t-beyond:#9a5b00;--t-beyond-bg:#fff1d6;--t-coach:#5b3fb5;--t-coach-bg:#ece7fb;
  --shadow:0 1px .5px rgba(11,20,26,.14);
}
[data-theme=dark]{
  --hdr:#1c2240;--bg:#0b141a;--dot:rgba(255,255,255,.035);
  --in:#202c33;--out:#005c4b;--doc:#1b2a44;--doc-line:#6d9bf0;
  --tx:#e9edef;--mut:#8696a0;--card:#202c33;--line:rgba(255,255,255,.12);
  --say:#22301a;--proof:#1d2447;--avoid:#3b1f22;--avoid-tx:#ffb4b4;
  --chip:#1f2c34;--chip-tx:#aab6ff;--chip-line:rgba(170,182,255,.35);
  --sheet:#202c33;--field:#2a3942;--bar:#111b21;
  --t-deck:#6ee7a0;--t-deck-bg:#12382a;--t-beyond:#ffc861;--t-beyond-bg:#3d2f10;--t-coach:#c3b2ff;--t-coach-bg:#2b2450;
  --shadow:none;
}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--tx);background:#d9d4cc;overflow:hidden}
[data-theme=dark] body{background:#050a0d}
.app{position:relative;display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;background:var(--bg);overflow:hidden}
@media(min-width:700px){
  body{background:linear-gradient(#2f3d94 0 200px,#d9d4cc 200px)}
  [data-theme=dark] body{background:linear-gradient(#161b3a 0 200px,#050a0d 200px)}
  .app{height:min(calc(100dvh - 32px),880px);margin:16px auto;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.28)}
}

/* header */
.hdr{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--hdr);color:var(--hdr-tx);flex:none;z-index:3}
.avatar{position:relative;width:42px;height:42px;border-radius:50%;background:#fff;flex:none}
.avatar img{width:100%;height:100%;border-radius:50%;display:block}
.logo{display:block;width:100%;max-width:190px;height:auto;border-radius:8px;background:#fff}
.avatar .dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#25d366;border:2px solid var(--hdr)}
.who{flex:1;min-width:0}
.name{font-weight:700;font-size:16.5px;line-height:1.2}
.status{font-size:12.5px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border:0;background:transparent;color:inherit;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover,.ib:focus-visible{background:rgba(255,255,255,.14);outline:none}
.ring svg{display:block}

/* chat */
.chat{position:relative;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 10px 8px;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:22px 22px;scroll-behavior:auto}
.datechip{text-align:center;margin:2px 0 10px}
.datechip span{display:inline-block;background:var(--card);color:var(--mut);font-size:12px;padding:4px 10px;border-radius:8px;box-shadow:var(--shadow)}
.row{display:flex;margin:0 0 4px;animation:pop .22s ease-out both}
.row.me{justify-content:flex-end}
.row.bot{justify-content:flex-start}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.bubble{position:relative;max-width:88%;padding:7px 10px 6px;border-radius:12px;font-size:15px;line-height:1.42;box-shadow:var(--shadow);overflow-wrap:anywhere;word-break:break-word}
.row.bot .bubble{background:var(--in);border-top-left-radius:3px}
.row.me .bubble{background:var(--out);border-top-right-radius:3px}
.bubble.card{max-width:94%;width:94%}
.bubble.doctor{background:var(--doc);border-left:4px solid var(--doc-line);max-width:92%}
.bubble .meta{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--mut);margin-top:2px}
.spk{border:0;background:transparent;color:var(--mut);font-size:15px;line-height:1;cursor:pointer;padding:3px 7px;border-radius:12px;min-height:28px;margin-right:auto}
.spk:hover,.spk:focus-visible{background:var(--proof);outline:none}
.spk.on{background:var(--acc);color:#fff}
.tick{color:#53bdeb;font-size:13px;letter-spacing:-3px}
.ttl{font-weight:700;margin-bottom:3px}
.ln{margin:0}.gap{height:6px}
.bl{display:flex;gap:7px;margin:2px 0}.bl>span:first-child{flex:none;min-width:12px;color:var(--acc-d);font-weight:700}
[data-theme=dark] .bl>span:first-child{color:#b6e07f}
.sb{display:flex;gap:6px;margin:1px 0 1px 16px;font-size:14px}.sb>span:first-child{color:var(--mut)}
.src{display:inline-flex;gap:6px;align-items:flex-start;margin-top:7px;padding:4px 8px;border-radius:8px;font-size:12px;line-height:1.3}
.src b{white-space:nowrap}
.src.ref{background:var(--t-deck-bg);color:var(--t-deck)}
.say{background:var(--say);border-left:4px solid var(--acc);border-radius:8px;padding:8px 10px}
.sayh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--acc-d);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
[data-theme=dark] .sayh{color:#b6e07f}
.cp{border:1px solid var(--acc);background:transparent;color:var(--acc-d);font-size:12px;font-weight:700;border-radius:999px;padding:4px 11px;cursor:pointer;text-transform:none;letter-spacing:0;min-height:28px}
[data-theme=dark] .cp{color:#b6e07f}
.sayt{font-size:15px;font-style:italic}
.proof{background:var(--proof);border-radius:8px;padding:8px 10px}
.ph{font-size:12px;font-weight:700;color:var(--chip-tx);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.avoid{margin-top:7px;background:var(--avoid);color:var(--avoid-tx);border-radius:8px;padding:6px 9px;font-size:13.5px}
.docname{font-size:12px;font-weight:700;color:var(--doc-line);margin-bottom:2px}
.docq{font-size:16px;font-weight:600}

/* typing */
.typing .bubble{display:flex;gap:4px;padding:11px 13px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);opacity:.5;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-4px);opacity:1}}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 6px 2px;animation:pop .25s ease-out both}
.chip{border:1.5px solid var(--chip-line);background:var(--chip);color:var(--chip-tx);font:inherit;font-size:14px;font-weight:600;padding:8px 13px;border-radius:18px;cursor:pointer;min-height:38px;text-align:left;box-shadow:var(--shadow)}
.chip:hover,.chip:focus-visible{border-color:var(--acc);outline:none}
.chip.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.pri:hover{background:var(--acc-d)}

/* list / category cards */
.list{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;width:94%;max-width:94%}
.lh{padding:10px 12px;font-weight:700;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.li{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--chip-tx);font:inherit;font-size:14.5px;padding:11px 12px;cursor:pointer;min-height:44px}
.li:first-of-type{border-top:0}
.lh2{padding:7px 12px;font-size:12px;font-weight:700;color:var(--mut);background:var(--proof);text-transform:uppercase;letter-spacing:.3px;border-top:1px solid var(--line)}
.li:hover,.li:focus-visible{background:var(--proof);outline:none}
.li span{color:var(--mut);font-size:18px;flex:none}
.li .t{flex:1;color:inherit;font-size:inherit}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:94%}
.cat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;font:inherit;color:var(--tx);cursor:pointer;box-shadow:var(--shadow);min-height:84px}
.cat:hover,.cat:focus-visible{border-color:var(--acc);outline:none}
.cat b{display:block;font-size:14.5px;margin:2px 0}
.cat small{display:block;color:var(--mut);font-size:12px;line-height:1.3}
.cat .ci{font-size:22px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}
.tile{background:var(--proof);border-radius:10px;padding:8px 9px}
.tile b{display:block;font-size:17px;color:var(--acc-d);line-height:1.15}
[data-theme=dark] .tile b{color:#b6e07f}
.tile span{display:block;font-size:12px;color:var(--mut);line-height:1.25;margin-top:2px}
.score{display:grid;gap:3px}
.score div{display:flex;gap:7px}

/* bottom bars */
.suggest{flex:none;background:var(--bar);border-top:1px solid var(--line)}
.sg{display:flex;width:100%;gap:10px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--tx);font:inherit;font-size:14.5px;text-align:left;padding:10px 14px;cursor:pointer;min-height:44px}
.sg:last-child{border-bottom:0}
.sg i{font-style:normal;opacity:.7}
.sg:hover,.sg:focus-visible{background:var(--proof);outline:none}
.shortcuts{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px 10px 2px;background:var(--bar);scrollbar-width:none}
.shortcuts::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--chip-line);background:var(--chip);color:var(--chip-tx);font:inherit;font-size:13.5px;font-weight:600;border-radius:999px;padding:7px 13px;cursor:pointer;min-height:36px;white-space:nowrap}
.pill:hover,.pill:focus-visible{border-color:var(--acc);outline:none}
.composer{flex:none;display:flex;gap:8px;align-items:center;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--bar)}
.composer input{flex:1;min-width:0;border:0;background:var(--field);color:var(--tx);font:inherit;font-size:16px;padding:12px 16px;border-radius:24px;outline:none;box-shadow:var(--shadow)}
.composer input:focus-visible{box-shadow:0 0 0 2px var(--acc)}
.composer input::placeholder{color:var(--mut)}
.send,.mic{width:46px;height:46px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.send{background:var(--acc);color:#fff}.send:hover{background:var(--acc-d)}
.mic{background:var(--field);color:var(--mut);box-shadow:var(--shadow)}
.mic.on{background:#e5484d;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(229,72,77,.2)}}
.send:focus-visible,.mic:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);max-height:86dvh;overflow:auto;background:var(--sheet);border-radius:18px 18px 0 0;z-index:11;padding:6px 0 calc(14px + env(safe-area-inset-bottom));animation:up .25s ease-out both}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 8px}
.sh{padding:4px 18px 8px;font-weight:700;font-size:17px}
.mi{display:flex;width:100%;gap:14px;align-items:center;border:0;background:transparent;color:var(--tx);font:inherit;font-size:15.5px;text-align:left;padding:13px 18px;cursor:pointer;min-height:50px}
.mi:hover,.mi:focus-visible{background:var(--proof);outline:none}
.mi .e{font-size:20px;width:26px;text-align:center}
.mi small{display:block;color:var(--mut);font-size:12.5px}
.about{padding:0 18px 8px;font-size:14px;line-height:1.5}
.about h4{margin:12px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.about p{margin:4px 0}
.about .src{margin:3px 0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#111b21;color:#fff;font-size:14px;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
